# Rebuilds demo_prod from master every night and puts the demo drift back,
# so the drift report always has something to show. Also runnable on demand before a call.
name: prod-drift-reset

on:
  schedule:
    - cron: "23 1 * * 1-5"   # 01:23 UTC, weekdays
  workflow_dispatch:
    inputs:
      mode:
        description: "reset = rebuild prod + drift; inject = snapshot current prod + drift"
        type: choice
        options: [reset, inject]
        default: reset

concurrency:
  group: demo-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      FLYWAY_VERSION: "12.0.1"
      FLYWAY_EMAIL: ${{ secrets.FLYWAY_EMAIL }}
      FLYWAY_TOKEN: ${{ secrets.FLYWAY_TOKEN }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet "databricks-sdk>=0.40,<1"

      - name: Install Flyway CLI
        run: |
          curl -fsSL "https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/$FLYWAY_VERSION/flyway-commandline-$FLYWAY_VERSION-linux-x64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flyway-$FLYWAY_VERSION" >> "$GITHUB_PATH"

      # The committed prod environment signs in through a browser (OAuth U2M), which can't work in CI.
      # On the runner only, swap its connection for a PAT (AuthMech=3) against the same catalog.
      # Keeping the name "prod" means any per-environment config (placeholders, .conf files) still applies.
      - name: Token sign-in for prod (runner only)
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path("flyway.toml")
          lines = p.read_text(encoding="utf-8").splitlines()
          out, skip = [], False
          for line in lines:
              m = re.match(r"^\s*\[([^\]]+)\]\s*$", line)
              if m:
                  name = m.group(1).strip()
                  skip = name == "environments.prod" or name.startswith("environments.prod.")
              if not skip:
                  out.append(line)
          out += [
              "",
              "[environments.prod]",
              'url = "jdbc:databricks://adb-7405611424302232.12.azuredatabricks.net:443/default;transportMode=http;ssl=1;AuthMech=3;httpPath=/sql/1.0/warehouses/353a9a5f7ad7299f;ConnCatalog=demo_prod"',
              'user = "token"',
              'password = "${env.DATABRICKS_TOKEN}"',
          ]
          p.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY
          grep -A3 '^\[environments.prod\]' flyway.toml | sed 's/password = .*/password = <from secret>/'

      - name: Reset prod and add drift
        env:
          MODE: ${{ inputs.mode || 'reset' }}
        run: python demo-drift/prod_drift.py "$MODE" --yes

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-drift-report
          path: demo-drift/reports/
          if-no-files-found: ignore
